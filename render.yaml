# Render Blueprint — Kutsakai TV API (free tier)
# Usa via Dashboard → New → Blueprint → aponta para o repo.
# ATENÇÃO: plano Free não tem disco persistente. O SQLite vive em /tmp
# e APAGA a cada restart/redeploy. Serve para demo/teste com sub-domínio.
# Persistência grátis: define as variáveis S3_* (Cloudflare R2) — a API restaura a DB
# no arranque e faz backup periódico + no SIGTERM (ver DEPLOY.md, secção Persistência).
services:
  - type: web
    name: kutsakai-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SQLITE_PATH
        value: /tmp/data.db
      - key: ALLOWED_ORIGINS
        # trocar pelos teus sub-domínios reais depois do Pages no ar
        value: https://tv.kutsakai.dpdns.org,https://kutsakai-tv.pages.dev
      - key: ALLOWED_ORIGIN_SUFFIXES
        # cobre os previews do Pages (abc123.kutsakai-tv.pages.dev)
        value: .kutsakai-tv.pages.dev
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        # email da conta admin (regista essa conta no site → fica admin sozinha)
        value:
      - key: PLAN_DAILY_PRICE
        value: 15
      - key: PLAN_WEEKLY_PRICE
        value: 105
      - key: PLAN_MONTHLY_PRICE
        value: 450
      # --- persistência (Cloudflare R2 ou outro S3-compatível) ---
      - key: S3_ENDPOINT
        sync: false   # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_INTERVAL_SEC
        value: 60
      - key: WHATSAPP_NUMBER
        value:
      - key: MPESA_MERCHANT_MSISDN
        value:
      - key: EMOLA_MERCHANT_MSISDN
        value:
