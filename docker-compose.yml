services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: iptv
      POSTGRES_PASSWORD: iptv
      POSTGRES_DB: iptv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://iptv:iptv@postgres:5432/iptv
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-change-me}
    depends_on:
      - postgres
      - redis

  worker:
    build: ./apps/worker
    environment:
      DATABASE_URL: postgresql://iptv:iptv@postgres:5432/iptv
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
      - api

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/v1
    depends_on:
      - api

volumes:
  pgdata:
